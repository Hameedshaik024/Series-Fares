name: Daily WhatsApp fare post

# Triggers the app's existing /api/whatsapp/send-monthly endpoint once a
# day - it does the actual work (scrape all 3 routes, build posters, send
# to each WhatsApp group). This workflow is just the alarm clock.
#
# 08:00 IST = 02:30 UTC. GitHub Actions cron is UTC only.
#
# Requires a repo secret APP_PASSWORD matching the Render service's
# APP_PASSWORD env var (Settings -> Secrets and variables -> Actions ->
# New repository secret). Also requires the Render app to actually be
# awake and logged in at trigger time - see DEPLOY.md for the UptimeRobot
# keep-alive setup this depends on.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-monthly and wait for it to actually finish
        run: |
          set -e
          BASE="https://series-fares.onrender.com"
          AUTH="Authorization: Bearer ${{ secrets.APP_PASSWORD }}"

          # /api/whatsapp/send-monthly starts a background job and returns
          # immediately (so a slow scrape can't time out the HTTP request) -
          # a bare curl call "succeeding" here only means the job *started*,
          # not that it finished or worked. Poll the status endpoint until
          # it's actually done, and fail this step for real if the job
          # errors, instead of declaring success the instant it starts.
          #
          # Not using curl -f: it discards the response body on an HTTP
          # error, which turned a real 401/500 into an opaque "exit code
          # 22" with no way to tell what actually happened. Capturing the
          # status code and body separately instead, so a failure here
          # always prints the server's actual error message.
          echo "Starting the WhatsApp send job..."
          HTTP_CODE=$(curl -s --max-time 120 --retry 2 --retry-delay 15 \
            -o /tmp/start_resp.json -w "%{http_code}" \
            -X POST "$BASE/api/whatsapp/send-monthly" -H "$AUTH")
          START_RESP=$(cat /tmp/start_resp.json)
          echo "HTTP $HTTP_CODE: $START_RESP"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "send-monthly request failed (HTTP $HTTP_CODE) - see response body above"
            exit 1
          fi
          JOB_ID=$(echo "$START_RESP" | jq -r '.job_id')
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "No job_id in response - aborting"
            exit 1
          fi

          echo "Polling job $JOB_ID..."
          for i in $(seq 1 180); do
            sleep 10
            STATUS_HTTP_CODE=$(curl -s --max-time 30 -o /tmp/status_resp.json -w "%{http_code}" \
              "$BASE/api/generate/status/$JOB_ID" -H "$AUTH")
            STATUS_RESP=$(cat /tmp/status_resp.json)
            if [ "$STATUS_HTTP_CODE" -lt 200 ] || [ "$STATUS_HTTP_CODE" -ge 300 ]; then
              echo "[$i] status check failed (HTTP $STATUS_HTTP_CODE): $STATUS_RESP"
              continue
            fi
            STATUS=$(echo "$STATUS_RESP" | jq -r '.status')
            echo "[$i] status: $STATUS"
            if [ "$STATUS" = "done" ]; then
              echo "Result:"
              echo "$STATUS_RESP" | jq '.result'
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              echo "Job failed:"
              echo "$STATUS_RESP" | jq '.'
              exit 1
            fi
          done

          # Confirmed live: a 15-minute window was too short for a
          # genuinely slow run (3 routes x 30 dates with retries, on
          # Render's shared free-tier CPU) - the job had actually
          # completed and sent the posters, just after GitHub gave up
          # watching. 30 minutes gives real breathing room before this
          # workflow reports a failure that isn't one.
          echo "Timed out after 30 minutes waiting for the job to finish"
          exit 1
